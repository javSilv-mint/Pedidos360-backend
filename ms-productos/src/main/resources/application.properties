# ===== Identidad del microservicio =====
spring.application.name=ms-productos
server.port=8081

# ===== Conexion a MySQL (cloud: RDS / Azure MySQL) =====
# En local: jdbc:mysql://localhost:3306/pedidos360_productos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pedidos360_productos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== Logging =====
logging.level.cl.duoc.pedidos360=${LOG_LEVEL:INFO}

# ===== Seguridad: validacion de JWT (Microsoft Entra External ID) =====
# Los valores se copian desde:
#   https://<SUBDOMINIO>.ciamlogin.com/<TENANT_ID>/v2.0/.well-known/openid-configuration
#   AZURE_ISSUER_URI   -> campo "issuer"
#   AZURE_JWK_SET_URI  -> campo "jwks_uri"
#   AZURE_API_CLIENT_ID -> Application (client) ID del registro del API (claim "aud")
# Con esto Spring valida firma, issuer, audience y expiracion (exp/nbf) de cada token.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AZURE_JWK_SET_URI}
# Se aceptan ambos formatos de "aud": GUID (token v2) y Application ID URI api://GUID (token v1)
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_API_CLIENT_ID},api://${AZURE_API_CLIENT_ID}

# Scope que todo token debe traer (claim "scp") y origenes CORS permitidos (separados por coma)
app.security.required-scope=${AZURE_API_SCOPE:access_as_user}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
